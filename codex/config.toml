# Codex CLI configuration -- portable template.
#
# Machine-specific sections are intentionally NOT included here:
#   [projects.*]      trust list  -> re-trust folders per machine
#   [marketplaces.*]  local cache -> regenerated by Codex on install
#
# setup.ps1 rewrites the notify path below for the current Windows user.

# Play a finish sound when Codex completes a turn.
notify = ["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "C:\\Users\\ASUS\\.codex\\notify.ps1"]

# Model defaults.
model = "gpt-5.5"
model_reasoning_effort = "xhigh"

[windows]
sandbox = "elevated"

# Plugins. If the marketplace isn't present on a new machine, re-add it
# through the Codex plugin UI, then these enable flags apply.
[plugins."github@openai-curated"]
enabled = true

[plugins."browser-use@openai-bundled"]
enabled = true
